{% assign p = include.p %}
<article class="project-card">
  <a href="{{ p.url | relative_url }}">
    {% if p.thumb %}<div class="project-card__thumb"><img src="{{ p.thumb | relative_url }}" alt="{{ p.title }}"></div>{% endif %}
    <h3 class="project-card__title">{{ p.title }}</h3>
  </a>
  {% if p.tagline %}<p class="project-card__tagline">{{ p.tagline }}</p>{% endif %}
  {% if p.venue %}<p class="project-card__venue"><em>{{ p.venue }}</em></p>{% endif %}
</article>
