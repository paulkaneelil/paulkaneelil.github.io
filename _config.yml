# ---------------------------------------------------------------
# Site settings — edit these
# ---------------------------------------------------------------
title: Paul R. Kaneelil
description: Postdoctoral Fellow at Harvard University
url: "https://paulkaneelil.github.io"
baseurl: ""
locale: en-US

remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default   # air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

# Research projects live in _projects/ and each gets its own page
collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true

# ---------------------------------------------------------------
# Sidebar profile (shown on every page)
# ---------------------------------------------------------------
author:
  name: Paul R. Kaneelil
  avatar: /assets/img/paulkaneelil.jpg
  bio: "Postdoctoral Fellow at Harvard University"
  links:
    - label: Email
      icon: fas fa-fw fa-envelope
      url: mailto:pkaneelil@g.harvard.edu
    - label: Google Scholar
      icon: ai ai-google-scholar
      url: https://scholar.google.com/citations?user=9TdPmXwAAAAJ&hl=en


footer:
  links: []

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
